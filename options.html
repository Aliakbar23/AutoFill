<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Pengaturan FormPilot AI</title>
  <style>
    body {
      font: 14px/1.6 "Segoe UI", system-ui, sans-serif;
      background: #0c0d12; color: #e9ebf2;
      max-width: 640px; margin: 40px auto; padding: 0 20px;
    }
    h1 {
      font-size: 19px;
      background: linear-gradient(135deg,#6366f1,#8b5cf6);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    h2 { font-size: 14px; margin-top: 28px; color: #8b93a3; border-top: 1px solid #262b36; padding-top: 18px; }
    label { display: block; margin: 14px 0 4px; color: #8b93a3; font-size: 12px; }
    input, select { width: 100%; padding: 9px; border-radius: 8px; border: 1px solid #262a36;
            background: #1a1d26; color: #e9ebf2; font: inherit; }
    .hint { color: #8b91a3; font-size: 12px; margin-top: 4px; }
    button { margin-top: 18px; padding: 10px 18px; border: 0; border-radius: 8px;
             background: linear-gradient(135deg,#6366f1,#8b5cf6); color: #fff; font-weight: 700; cursor: pointer; }
    #status { margin-top: 12px; color: #2ecc71; }
  </style>
</head>
<body>
  <h1>⚙️ Pengaturan FormPilot AI</h1>

  <h2>Provider aktif</h2>
  <label>Provider</label>
  <select id="provider">
    <option value="gemini">Google Gemini — gratis ✅</option>
    <option value="groq">Groq — gratis, super cepat ✅</option>
    <option value="openrouter">OpenRouter — gratis (:free) ✅</option>
    <option value="ollama">Ollama — lokal, offline ✅</option>
    <option value="openai">OpenAI</option>
    <option value="custom">Custom OpenAI-compatible</option>
  </select>

  <label>API Key</label>
  <input type="password" id="key" placeholder="API key…" />
  <div class="hint" id="keyHint"></div>

  <label>Model</label>
  <input type="text" id="model" list="modelList" placeholder="nama-model" />
  <datalist id="modelList"></datalist>
  <div class="hint" id="modelHint"></div>

  <label>Base URL (hanya provider Custom)</label>
  <input type="text" id="baseURL" placeholder="https://openrouter.ai/api/v1" />
  <div class="hint">
    Contoh: OpenRouter <code>https://openrouter.ai/api/v1</code> ·
    Groq <code>https://api.groq.com/openai/v1</code> ·
    Ollama lokal <code>http://localhost:11434/v1</code>
  </div>

  <button id="save">💾 Simpan</button>
  <div id="status"></div>

  <script src="providers.js"></script>
  <script src="options.js"></script>
</body>
</html>
